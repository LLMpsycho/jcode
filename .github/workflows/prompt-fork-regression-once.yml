name: Prompt fork regression (one-shot)

on:
  pull_request:
    branches: [master]
    paths: ['.github/workflows/prompt-fork-regression-once.yml']

permissions:
  contents: read

concurrency:
  group: prompt-fork-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-and-verify:
    if: github.event.pull_request.head.repo.full_name == 'LLMpsycho/jcode' && github.event.pull_request.head.ref == 'fix/remote-review-orchestration'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      JCODE_CI: '1'
      JCODE_DEV_FEATURE_PROFILE: minimal
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: stable
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Load the reviewed scripts from this branch's pinned parent
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import yaml
          source = subprocess.check_output([
              'git', 'show', '7bbe6c823320d405b7d417a3dac87af3aafee0c6:.github/workflows/prompt-fork-regression-once.yml'
          ], text=True)
          steps = yaml.safe_load(source)['jobs']['fix-and-verify']['steps']
          selected = {step.get('name'): step.get('run') for step in steps}
          before = selected['Reproduce route loss and non-durable empty forks']
          after = selected['Preserve child identity and durability across local, remote and transfer paths']
          old = 'fn post_merge_fork_child_is_durable_while_untouched_root_stays_ephemeral() -> Result<()> {'
          new = old.replace('Result<()>', 'anyhow::Result<()>')
          assert after.count(old) == 1
          after = after.replace(old, new)
          directory = Path(os.environ['RUNNER_TEMP'])
          (directory / 'fork-before.sh').write_text(before)
          (directory / 'fork-after.sh').write_text(after)
          PY
      - name: Reproduce route loss and non-durable empty forks
        shell: bash
        run: bash -e -o pipefail "$RUNNER_TEMP/fork-before.sh"
      - name: Verify fixed local forks, remote splits, transfers and persistence
        shell: bash
        run: bash -e -o pipefail "$RUNNER_TEMP/fork-after.sh"
      - name: Retain red-green evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-fork-regression-evidence
          path: ${{ runner.temp }}/prompt-fork-*
          retention-days: 7
      - name: Publish only verified source changes to the owned PR branch
        shell: bash
        run: |
          test "$(git ls-remote origin refs/heads/fix/remote-review-orchestration | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/jcode-base/src/session/persistence.rs crates/jcode-base/src/session_tests/mod.rs crates/jcode-base/src/session_tests/child_persistence.rs crates/jcode-app-core/src/server/client_actions.rs crates/jcode-app-core/src/server/client_actions_fork_tests.rs crates/jcode-tui/src/tui/app/commands_review.rs crates/jcode-tui/src/tui/app/tests.rs crates/jcode-tui/src/tui/app/tests/post_merge_fork.rs
          git diff --cached --check
          git commit -m 'fix: preserve durable child sessions and exact fork/transfer model settings'
          git push origin HEAD:refs/heads/fix/remote-review-orchestration
