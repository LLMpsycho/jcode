name: Prompt fork regression (one-shot)

on:
  pull_request:
    branches: [master]
    paths: ['.github/workflows/prompt-fork-regression-once.yml']

permissions:
  contents: read

jobs:
  fix-and-verify:
    if: github.event.pull_request.head.repo.full_name == 'LLMpsycho/jcode' && github.event.pull_request.head.ref == 'fix/remote-review-orchestration'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      JCODE_CI: '1'
      JCODE_DEV_FEATURE_PROFILE: minimal
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: stable
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Add real persisted-child regressions against unchanged fork behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('crates/jcode-tui/src/tui/app')
          path = root / 'commands_review.rs'
          text = path.read_text()
          old = 'fn clone_session_for_prompt(app: &App)'
          assert text.count(old) == 1
          path.write_text(text.replace(old, 'pub(super) ' + old))
          path = root / 'tests.rs'
          text = path.read_text()
          assert 'mod post_merge_fork;' not in text
          path.write_text(text + '\n#[path = "tests/post_merge_fork.rs"]\nmod post_merge_fork;\n')
          (root / 'tests/post_merge_fork.rs').write_text('''use super::*;
          
          fn assert_prompt_fork_route(
              route: Option<crate::config::ConfigModelRoute>,
              api: Option<&str>,
              effort: Option<&str>,
          ) {
              with_temp_jcode_home(|| {
                  let mut app = create_test_app();
                  app.is_remote = false;
                  app.session.title = Some("fork parent".into());
                  app.session.model = Some("chosen-model".into());
                  app.session.provider_key = Some("openai-oauth".into());
                  app.session.route_api_method = api.map(str::to_owned);
                  app.session.reasoning_effort = effort.map(str::to_owned);
                  app.session.role_model_selection = route.clone();
                  app.session.provider_session_id = Some("parent-provider-conversation".into());
                  app.session.autoreview_enabled = Some(true);
                  app.session.autojudge_enabled = Some(false);
                  let parent_id = app.session.id.clone();
                  let (child_id, _) = crate::tui::app::commands_review::clone_session_for_prompt(&app)
                      .expect("fork local prompt session");
                  let mut child = crate::session::Session::load(&child_id).expect("reload fork");
                  assert_ne!(child_id, parent_id);
                  assert_eq!(child.parent_id.as_deref(), Some(parent_id.as_str()));
                  assert_eq!(child.model, app.session.model);
                  assert_eq!(child.provider_key, app.session.provider_key);
                  assert_eq!(child.route_api_method.as_deref(), api);
                  assert_eq!(child.reasoning_effort.as_deref(), effort);
                  assert_eq!(child.role_model_selection, route);
                  assert_eq!(child.autoreview_enabled, Some(true));
                  assert_eq!(child.autojudge_enabled, Some(false));
                  assert!(child.provider_session_id.is_none(), "never reuse the parent's provider conversation");
                  child.reasoning_effort = Some("low".into());
                  child.role_model_selection = None;
                  child.save().expect("save independent child selection");
                  assert_eq!(app.session.reasoning_effort.as_deref(), effort);
                  assert_eq!(app.session.role_model_selection, route);
                  assert_eq!(app.session.provider_session_id.as_deref(), Some("parent-provider-conversation"));
              });
          }
          
          #[test]
          fn post_merge_review_prompt_fork_preserves_explicit_role_route() {
              assert_prompt_fork_route(
                  Some(crate::config::ConfigModelRoute {
                      model: "chosen-model".into(),
                      api_method: "openai-oauth".into(),
                      provider_label: "selected-account".into(),
                  }),
                  Some("openai-oauth"),
                  Some("high"),
              );
          }
          
          #[test]
          fn post_merge_review_prompt_fork_preserves_main_route_without_inventing_role() {
              assert_prompt_fork_route(None, Some("openai-oauth"), Some("medium"));
          }
          
          #[test]
          fn post_merge_review_prompt_fork_preserves_legacy_unset_selection() {
              assert_prompt_fork_route(None, None, None);
          }
          ''')
          PY
          cargo fmt --all
          set +e
          scripts/dev_cargo.sh test --locked -p jcode-tui --lib post_merge_review_prompt_fork -- --test-threads=1 > "$RUNNER_TEMP/prompt-fork-before.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/prompt-fork-before.log"
          test "$result" -ne 0
          grep -q 'test result: FAILED. 1 passed; 2 failed;' "$RUNNER_TEMP/prompt-fork-before.log"
      - name: Preserve exact route, role selection and reasoning effort
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/jcode-tui/src/tui/app/commands_review.rs')
          text = path.read_text()
          start = text.index('pub(super) fn clone_session_for_prompt(')
          before, fork = text[:start], text[start:]
          old = '    child.provider_key = app.session.provider_key.clone();\n'
          assert fork.count(old) == 1
          new = old + '    child.route_api_method = app.session.route_api_method.clone();\n    child.reasoning_effort = app.session.reasoning_effort.clone();\n    child.role_model_selection = app.session.role_model_selection.clone();\n'
          path.write_text(before + fork.replace(old, new))
          PY
          cargo fmt --all
          git diff --check
          scripts/dev_cargo.sh test --locked -p jcode-tui --lib post_merge_review -- --test-threads=1 | tee "$RUNNER_TEMP/prompt-fork-after.log"
          scripts/dev_cargo.sh test --locked -p jcode-tui --lib review_role -- --test-threads=1
          python3 scripts/check_module_files.py
          python3 scripts/check_dependency_boundaries.py
      - name: Retain red-green evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-fork-regression-evidence
          path: ${{ runner.temp }}/prompt-fork-*.log
          retention-days: 7
      - name: Publish only the verified source changes to the owned PR branch
        shell: bash
        run: |
          test "$(git ls-remote origin refs/heads/fix/remote-review-orchestration | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/jcode-tui/src/tui/app/commands_review.rs crates/jcode-tui/src/tui/app/tests.rs crates/jcode-tui/src/tui/app/tests/post_merge_fork.rs
          git diff --cached --check
          git commit -m 'fix: preserve exact model route and effort in local prompt forks'
          git push origin HEAD:refs/heads/fix/remote-review-orchestration
