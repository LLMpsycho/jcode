name: Phase 4 automation

on:
  push:
    branches:
      - automation/phase4-advisor-completion
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase4-automation
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out automation branch
        uses: actions/checkout@v4
        with:
          path: automation
      - name: Check out owned implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/phase4-advisor-completion
          path: worktree
          fetch-depth: 0
      - name: Inspect advisor integration surfaces
        shell: bash
        working-directory: worktree
        run: |
          set -euo pipefail
          echo '=== branch/base ==='
          git status --short --branch
          git log -1 --oneline
          echo '=== todo stable contracts ==='
          grep -n -E '^pub fn (load_todos|load_goals|load_plan)|^pub struct (TodoItem|TodoGoal|TodoPlan)' crates/jcode-base/src/todo.rs crates/jcode-task-types/src/lib.rs || true
          echo '=== session message fields ==='
          grep -n -A80 -E '^pub struct Session \{' crates/jcode-base/src/session.rs crates/jcode-session-types/src/lib.rs | head -180 || true
          echo '=== tool output fields ==='
          grep -n -A100 -E '^pub struct ToolOutput|^pub enum ContentBlock' crates/jcode-tool-types/src/lib.rs crates/jcode-message-types/src/lib.rs | head -240 || true
          echo '=== model-route cost/permission metadata ==='
          grep -R -n -E 'RouteCheapnessEstimate|cheapness|ResolvedCredential' crates/jcode-provider-core/src | head -220 || true
          echo '=== tests using captured advisor prompt ==='
          grep -R -n -E 'AdvisorTurnInput|advisor.*prompt|ModeCaptureProvider' crates/jcode-app-core/src/*test* crates/jcode-app-core/src/advisor.rs | head -260 || true
