name: Phase 4 automation

on:
  push:
    branches:
      - automation/phase4-advisor-completion
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase4-automation
  cancel-in-progress: true

jobs:
  implement-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out automation branch
        uses: actions/checkout@v4
        with:
          path: automation
      - name: Check out owned implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/phase4-advisor-completion
          path: worktree
          fetch-depth: 0
      - name: Apply bounded evidence enrichment
        shell: bash
        working-directory: worktree
        run: |
          set -euo pipefail
          objective='feat(advisor): enrich completed-turn evidence'
          if git log --format=%s origin/master..HEAD | grep -Fqx "$objective"; then
            echo 'evidence objective already committed'
            exit 0
          fi
          python3 ../automation/scripts/stage1_evidence.py
          cargo fmt --all
          git diff --check
          cargo test -p jcode-app-core --no-default-features --lib advisor::evidence::tests
          cargo test -p jcode-app-core --no-default-features --lib advisor::tests
          cargo check -p jcode-app-core --no-default-features --lib
          git config user.name 'LLMpsycho'
          git config user.email '211350563+LLMpsycho@users.noreply.github.com'
          git add crates/jcode-app-core/src/advisor.rs \
                  crates/jcode-app-core/src/advisor/evidence.rs \
                  crates/jcode-app-core/src/agent/turn_execution.rs
          git commit -m "$objective"
          git push origin HEAD:feat/phase4-advisor-completion
