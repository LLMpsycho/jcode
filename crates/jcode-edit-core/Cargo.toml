[package]
name = "jcode-edit-core"
version = "0.1.0"
edition = "2024"
description = "Pure normalization, anchored-edit, coverage, and preflight logic for Jcode"

[lib]
name = "jcode_edit_core"
path = "src/lib.rs"

[dependencies]
hex = "0.4"
jcode-edit-types = { path = "../jcode-edit-types" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "1"

[dev-dependencies]
serde_json = "1"
